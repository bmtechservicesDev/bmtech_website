name: Build website
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify generated routes
        run: |
          for page in index.html services/index.html solutions/index.html about/index.html contact/index.html; do
            test -s "dist/$page"
            grep -q '<main id="main">' "dist/$page"
          done
